<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝗡𝗢𝗡𝗦𝗧𝗢𝗣 𝗔𝗡𝗢𝗡𝗬𝗠𝗢𝗨𝗦 𝗖𝗬𝗕𝗘𝗥 𝗙𝗢𝗥𝗖𝗘 - Join Us</title>
  <style>
    :root {
      --neon-green: #00ff66;
      --neon-cyan: #00f0ff;
      --cyber-purple: #9d4edd;
      --danger-red: #ff2a55;
      --blood-red: #ff1738;
      --blood-smoke: rgba(255, 20, 50, 0.45);
      --dark-bg: #020404;
      --card-bg: rgba(5, 11, 10, 0.9);
      --input-bg: rgba(9, 19, 17, 0.94);
      --border-dim: rgba(0, 255, 102, 0.25);
      --text-main: #d5f7e4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      background-image:
        radial-gradient(circle at 20% 10%, rgba(0, 255, 102, 0.14), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(0, 240, 255, 0.12), transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(157, 78, 221, 0.14), transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Matrix Code Rain Canvas */
    #matrixCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.34;
      pointer-events: none;
    }

    /* Background Hacker Logo Watermark */
    .hacker-bg-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(72vw, 440px);
      height: min(72vw, 440px);
      z-index: 1;
      opacity: 0.085;
      pointer-events: none;
      filter: drop-shadow(0 0 25px rgba(0, 255, 102, 0.45));
      animation: slowPulse 7s ease-in-out infinite;
    }

    @keyframes slowPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.085;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.04);
        opacity: 0.13;
      }
    }

    /* Dark Web Scanlines & Vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.84) 100%),
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.28) 3px,
          rgba(0, 0, 0, 0.28) 4px
        );
      pointer-events: none;
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 610px;
      margin: 26px 15px;
      padding: 28px 24px;
      background: linear-gradient(165deg, rgba(6, 15, 13, 0.93), rgba(4, 9, 12, 0.95));
      border: 1px solid rgba(0, 255, 102, 0.55);
      border-radius: 12px;
      box-shadow:
        0 0 28px rgba(0, 255, 102, 0.16),
        0 0 60px rgba(0, 240, 255, 0.09),
        inset 0 0 24px rgba(0, 255, 102, 0.05);
      backdrop-filter: blur(8px);
    }

    /* Corner Cyber Accents */
    .container::before,
    .container::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--neon-cyan);
      border-style: solid;
      pointer-events: none;
    }

    .container::before {
      top: -2px;
      left: -2px;
      border-width: 3px 0 0 3px;
      border-top-left-radius: 12px;
    }

    .container::after {
      bottom: -2px;
      right: -2px;
      border-width: 0 3px 3px 0;
      border-bottom-right-radius: 12px;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      color: var(--neon-green);
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px dashed rgba(0, 255, 102, 0.28);
      letter-spacing: 0.4px;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-red { background: #ff5f56; box-shadow: 0 0 6px #ff5f56; }
    .dot-yellow { background: #ffbd2e; box-shadow: 0 0 6px #ffbd2e; }
    .dot-green { background: #27c93f; box-shadow: 0 0 6px #27c93f; }

    /* Top Hacker Emblem Badge */
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .hacker-badge {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      padding: 12px;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.16), rgba(0, 240, 255, 0.05));
      border: 2px solid var(--neon-green);
      box-shadow:
        0 0 18px rgba(0, 255, 102, 0.35),
        0 0 32px rgba(0, 240, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hacker-badge svg {
      width: 100%;
      height: 100%;
    }

    /* Blood-Red Smoke Text Feature */
    .blood-smoke-wrap {
      position: relative;
      display: block;
      text-align: center;
      overflow: visible;
    }

    .blood-smoke-plume {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 92%;
      height: 130%;
      transform: translate(-50%, -45%) scale(0.92);
      background:
        radial-gradient(ellipse at 30% 60%, rgba(255, 18, 48, 0.28), transparent 62%),
        radial-gradient(ellipse at 70% 45%, rgba(190, 0, 32, 0.24), transparent 65%),
        radial-gradient(circle at 50% 30%, rgba(255, 45, 75, 0.2), transparent 70%);
      filter: blur(12px);
      pointer-events: none;
      z-index: 0;
      animation: bloodSmokeRise 4.2s ease-in-out infinite;
    }

    @keyframes bloodSmokeRise {
      0% {
        transform: translate(-50%, -35%) scale(0.9);
        opacity: 0.35;
      }
      50% {
        transform: translate(-48%, -62%) scale(1.08);
        opacity: 0.75;
      }
      100% {
        transform: translate(-52%, -82%) scale(1.18);
        opacity: 0.15;
      }
    }

    h1 {
      position: relative;
      z-index: 1;
      text-align: center;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--blood-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 -6px 14px rgba(255, 23, 56, 0.55))
        drop-shadow(0 0 10px rgba(0, 255, 102, 0.25));
      margin: 0 0 8px 0;
      font-size: 21px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      animation: textBloodPulse 3.6s ease-in-out infinite;
    }

    @keyframes textBloodPulse {
      0%, 100% {
        filter:
          drop-shadow(0 -4px 10px rgba(255, 20, 50, 0.45))
          drop-shadow(0 0 8px rgba(0, 255, 102, 0.22));
      }
      50% {
        filter:
          drop-shadow(0 -12px 20px rgba(255, 20, 50, 0.8))
          drop-shadow(0 0 12px rgba(255, 42, 85, 0.4));
      }
    }

    p.subtitle {
      position: relative;
      z-index: 1;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      color: var(--neon-cyan);
      font-size: 13.5px;
      margin-bottom: 24px;
      text-shadow: 0 -4px 12px rgba(255, 23, 56, 0.5);
    }

    .rules-section {
      background: linear-gradient(135deg, rgba(255, 42, 85, 0.08), rgba(0, 255, 102, 0.04));
      border: 1px solid rgba(255, 42, 85, 0.35);
      border-left: 4px solid var(--danger-red);
      padding: 15px 16px;
      border-radius: 7px;
      margin-bottom: 24px;
    }

    .rules-section h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #ff5c7c;
      font-size: 15px;
      letter-spacing: 0.4px;
    }

    .rules-section ul {
      margin: 0;
      padding-left: 20px;
      font-size: 14px;
      color: #ccead9;
      line-height: 1.55;
    }

    .rules-section li {
      margin-bottom: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--neon-green);
      font-size: 14px;
      font-weight: 500;
    }

    label::before {
      content: "[#] ";
      font-family: 'Courier New', Courier, monospace;
      color: var(--neon-cyan);
      font-size: 12px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="tel"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border-dim);
      background-color: var(--input-bg);
      color: #ebfff4;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    input::placeholder,
    textarea::placeholder {
      color: #5b7e6d;
    }

    input:focus,
    textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.22);
    }

    textarea {
      resize: vertical;
      height: 85px;
    }

    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-option {
      flex: 1;
    }

    .radio-option input[type="radio"] {
      display: none;
    }

    .radio-option label {
      display: block;
      text-align: center;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      cursor: pointer;
      color: #cce8da;
      transition: all 0.25s;
    }

    .radio-option label::before {
      content: none;
    }

    .radio-option input[type="radio"]:checked + label {
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      color: #03100a;
      font-weight: bold;
      border-color: var(--neon-green);
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.38);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-btn {
      border: 2px dashed rgba(0, 240, 255, 0.55);
      color: var(--neon-cyan);
      background-color: var(--input-bg);
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
      text-align: center;
      cursor: pointer;
      display: block;
      transition: background 0.25s, border-color 0.25s, color 0.25s;
    }

    .file-input-btn:hover {
      background-color: rgba(0, 240, 255, 0.08);
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #00ff66, #00e5ff, #9d4edd);
      color: #030a07;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.25s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 22px rgba(0, 255, 102, 0.45);
    }

    .submit-btn:disabled {
      background: #283630;
      color: #7b9387;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }

    .social-links {
      display: flex;
      justify-content: space-around;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(0, 255, 102, 0.22);
    }

    .social-links a {
      color: var(--neon-green);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.25s, text-shadow 0.25s;
    }

    .social-links a:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.55);
    }

    /* Join Our Group Messenger Box */
    .Messenger-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed rgba(0, 240, 255, 0.28);
      text-align: center;
    }

    .whatsapp-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(0, 255, 102, 0.14), rgba(0, 240, 255, 0.14));
      border: 1px solid var(--neon-green);
      border-radius: 6px;
      color: var(--neon-green);
      text-decoration: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14.5px;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }

    .whatsapp-btn:hover {
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      color: #030a07;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.45);
    }

    /* Footer Credit with Blood Smoke */
    .developed-by {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 23, 56, 0.35);
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #b8d8c8;
      letter-spacing: 0.6px;
      text-shadow: 0 -5px 14px rgba(255, 23, 56, 0.55);
    }

    .developed-by span {
      color: #ff385c;
      font-weight: bold;
      text-shadow:
        0 -6px 14px rgba(255, 20, 50, 0.8),
        0 0 12px rgba(255, 42, 85, 0.6);
      animation: textBloodPulse 3.4s ease-in-out infinite;
    }

    /* Floating Blood Smoke Canvas over Featured Texts */
    .smoke-overlay-canvas {
      position: absolute;
      inset: -28px -12px;
      width: calc(100% + 24px);
      height: calc(100% + 40px);
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Matrix Rain Background -->
  <canvas id="matrixCanvas"></canvas>

  <!-- Background Hacker Emblem Watermark -->
  <svg class="hacker-bg-logo" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="88" stroke="#00ff66" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="100" cy="100" r="74" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M100 32L152 54V102C152 136 130 162 100 172C70 162 48 136 48 102V54L100 32Z" stroke="#00ff66" stroke-width="2.5"/>
    <circle cx="100" cy="96" r="24" stroke="#00f0ff" stroke-width="2.2"/>
    <circle cx="91" cy="94" r="4" fill="#00ff66"/>
    <circle cx="109" cy="94" r="4" fill="#00ff66"/>
    <path d="M88 106H112" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M76 138L100 122L124 138" stroke="#00ff66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="container">
    <div class="terminal-bar">
      <div class="dots">
        <span class="dot-red"></span>
        <span class="dot-yellow"></span>
        <span class="dot-green"></span>
      </div>
      <span>root@darknet-force:~# ./recruit.sh</span>
    </div>

    <!-- Top Hacker Logo Badge -->
    <div class="logo-container">
      <div class="hacker-badge">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 12L82 25V52C82 72 68 86 50 92C32 86 18 72 18 52V25L50 12Z" stroke="#00ff66" stroke-width="3.5" fill="rgba(0,255,102,0.08)"/>
          <circle cx="50" cy="48" r="13" stroke="#00f0ff" stroke-width="3"/>
          <circle cx="45" cy="47" r="2.5" fill="#00ff66"/>
          <circle cx="55" cy="47" r="2
